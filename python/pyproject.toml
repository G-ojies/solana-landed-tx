[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "solana-landed-tx"
description = "Reliable Solana transaction landing: priority fee estimation + send-and-confirm with retry."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["solana", "blockchain", "priority-fee", "transaction"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/G-ojies/solana-landed-tx"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "solana_landed_tx"
